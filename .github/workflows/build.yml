name: Cross-platform build verification
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - stable
          - 1.63.0
          - beta
    runs-on: debian-trixie
    steps:
      - name: Checkout source code
        uses: https://data.forgejo.org/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: rustup default ${{ matrix.toolchain }}
      - name: Build on Rust ${{ matrix.toolchain }}
        run: |
          cargo build --verbose --color always
  test:
    strategy:
      matrix:
        toolchain:
          - stable
          - 1.63.0
    runs-on: debian-trixie
    steps:
      - name: Checkout source code
        uses: https://data.forgejo.org/actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install Rust ${{ matrix.toolchain }} toolchain
        run: rustup default ${{ matrix.toolchain }}
      - name: Run tests
        run: |
          RUST_BACKTRACE=1 ./ci/ci-tests.sh --verbose --color always -- --show-output
        env:
          RAPID_GOSSIP_SYNC_SERVER_LOG_LEVEL: gossip
